.corporate-site {
  --rb-ink: #161616;
  --rb-muted: #525252;
  --rb-line: #d3d3d3;
  --rb-space: clamp(24px, 5.15vw, 96px);
  --rb-sans: 'Courier Prime', 'Courier New', Courier, monospace;
  --rb-serif: var(--rb-sans);
  background: #fff;
  color: var(--rb-ink);
  font: 400 16px/1.5 var(--rb-sans);
  margin: 0;
  -webkit-font-smoothing: antialiased;
}
.corporate-site *, .corporate-site *::before, .corporate-site *::after { box-sizing: border-box; }
.corporate-site :where(h1, h2, p, ul, figure) { margin: 0; }
.corporate-site a { color: inherit; text-decoration: none; }
.corporate-site button { font: inherit; color: inherit; }
.corporate-site img { display: block; max-width: 100%; }
.corporate-site [hidden] { display: none !important; }
.corporate-site :is(a, button):focus-visible { outline: 2px solid currentColor; outline-offset: 4px; }
.corporate-site main:focus { outline: none; }
.corporate-skip { position: absolute; z-index: 2; top: 8px; left: var(--rb-space); padding: 10px 16px; background: #fff; transform: translateY(-180%); }
.corporate-skip:focus { transform: translateY(0); }
.corporate-site ::selection { background: #d9d9d9; color: #111; }
.rb-bound { width: min(calc(100% - var(--rb-space) * 2), 1536px); margin-inline: auto; }
.rb-head, .rb-foot { display: flex; align-items: center; justify-content: space-between; gap: 32px; }
.rb-head { min-height: 88px; padding-block: 14px; border-bottom: 1px solid var(--rb-line); }
.rb-brand p { margin-top: 3px; color: var(--rb-muted); font-size: 12px; line-height: 1.3; }
.rb-wordmark { display: inline-flex; align-items: center; min-height: 44px; font-size: clamp(26px, 2.5vw, 39px); padding-right: .10em; }
.rb-head .rb-brand .rb-wordmark { min-height: auto; }
.rb-nav { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; column-gap: clamp(18px, 2.5vw, 43px); }
.rb-nav a { display: inline-flex; align-items: center; min-height: 44px; font-size: 14px; font-weight: 510; letter-spacing: -.024em; }
.rb-nav a:hover, .rb-textlink:hover, .rb-detail-top > div > a:hover { text-decoration: underline; text-underline-offset: .25em; }
.rb-hero { background: #161616; color: #f7f7f5; }
.rb-opening { position: relative; padding-block: clamp(52px, 7vw, 112px); }
.rb-opening h1 { font: 400 clamp(36px, 6.8vw, 108px)/1.02 var(--rb-sans); letter-spacing: -.055em; color: #f7f7f5; text-shadow: 0 2px 24px rgba(0, 0, 0, .32); }
.rb-opening h1 span { display: block; }
.rb-intro { display: flex; flex-wrap: wrap; gap: 2px 36px; justify-content: space-between; align-items: center; border-top: 1px solid #737373; padding-top: 12px; margin-top: clamp(25px, 4vw, 60px); }
.rb-intro p { font-size: clamp(15px, 1.4vw, 21px); }
.rb-intro .rb-textlink { font-size: 15px; }
.rb-label { font: 600 13px/1.4 var(--rb-sans); letter-spacing: .012em; }
.rb-practices { border-top: 1px solid #0D0D0D; padding-block: clamp(44px, 5vw, 80px) clamp(56px, 7vw, 112px); }
.rb-arrow { display: inline-grid; place-content: center; flex-shrink: 0; font: 400 .75em/1 var(--rb-sans); letter-spacing: 0; }
.rb-practice-diagram { display: flex; flex-direction: column; align-items: center; }
.rb-practice-root { position: relative; text-align: center; padding: 0 0 clamp(28px, 3.5vw, 48px); background: transparent; }
.rb-practice-root h2 { font: 400 clamp(34px, 4vw, 60px)/1.1 var(--rb-sans); letter-spacing: -.055em; color: #0D0D0D; }
.rb-practice-intro { max-width: 46ch; margin: 10px auto 0; color: var(--rb-muted); }
.rb-practice-pair { width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 480px)); justify-content: center; gap: 56px; }
.rb-practice { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; border: none; padding: 8px 12px; background: transparent; }
.rb-practice > span:empty { position: absolute; top: 0; }
.rb-practice h3 { margin: 0 0 12px; font: 700 clamp(16px, 1.45vw, 22px)/1.2 var(--rb-sans); letter-spacing: -.045em; color: #0D0D0D; white-space: nowrap; }
.rb-practice p { max-width: none; margin: 0; font-size: clamp(12px, .95vw, 14px); color: #0D0D0D; background: transparent; white-space: nowrap; }
.rb-textlink { display: inline-flex; align-items: center; justify-content: flex-start; gap: .65em; min-height: 44px; font: 500 16px/1.4 var(--rb-sans); letter-spacing: -.03em; }
.rb-textlink .rb-arrow { font-size: 1em; }
.rb-hero { position: relative; isolation: isolate; overflow: hidden; background: #0d0d0d; min-height: clamp(440px, 68vh, 740px); display: flex; align-items: center; }
.rb-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10, 10, 10, .32) 0%, rgba(10, 10, 10, .14) 48%, rgba(10, 10, 10, .62) 100%); pointer-events: none; z-index: 1; }
.rb-hero .rb-opening { z-index: 2; }
.rb-ground-film { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; object-fit: cover; opacity: .82; filter: contrast(1.06) saturate(.85); pointer-events: none; }
.rb-inquiries::before { content: ""; position: absolute; inset: 0 0 auto; height: 1px; background: var(--rb-ink); transform-origin: left; }
.rb-inquiries { position: relative; display: grid; grid-template-columns: 1fr 2fr; align-items: baseline; padding-block: clamp(66px, 7.4vw, 134px); }
.rb-inquiries .rb-textlink { justify-self: start; font: 400 clamp(40px, 5.1vw, 82px)/1.08 var(--rb-serif); letter-spacing: -.05em; gap: .45em; }
.rb-inquiries .rb-arrow { font-size: .65em; }
.rb-foot { border-top: 1px solid var(--rb-line); padding-block: 28px 42px; }
.rb-foot .rb-wordmark { font-size: 26px; }
.rb-foot p { margin-top: 3px; color: var(--rb-muted); font-size: 12px; }
.rb-detail-top { display: grid; grid-template-columns: minmax(0, 1.04fr) minmax(0, .96fr); align-items: end; gap: 8%; padding-block: clamp(56px, 7vw, 118px); }
.rb-detail-top > div > a { display: inline-flex; align-items: center; min-height: 44px; }
.rb-detail-top h1 { font: 400 clamp(36px, 5.4vw, 83px)/.98 var(--rb-serif); letter-spacing: -.055em; margin: 20px 0 25px; }
.rb-detail-lead { max-width: 33ch; font-size: clamp(20px, 1.85vw, 32px); line-height: 1.35; letter-spacing: -.035em; }
.rb-detail-body { display: grid; grid-template-columns: 1.17fr .83fr; gap: 12%; padding-block: 42px 75px; border-top: 1px solid var(--rb-ink); }
.rb-detail-body p { max-width: 55ch; font-size: clamp(17px, 1.35vw, 22px); line-height: 1.55; letter-spacing: -.018em; }
.rb-detail-body p + p { margin-top: 1em; }
.rb-detail-body aside { display: flex; flex-direction: column; align-items: flex-start; }
@media (max-width: 780px) {
  .rb-head { min-height: 73px; }
}
@media (max-width: 767px) {
  .rb-practice-root { width: 100%; max-width: 480px; }
  .rb-practice-pair { grid-template-columns: minmax(0, 480px); gap: 28px; }
  .rb-practice h3, .rb-practice p { white-space: normal; }
}
@media (max-width: 600px) {
  .corporate-site { --rb-space: clamp(18px, 5.4vw, 30px); }
  .rb-head { gap: 12px; min-height: 65px; }
  .rb-wordmark { font-size: 24px; }
  .rb-nav { column-gap: clamp(9px, 2.4vw, 14px); }
  .rb-nav a { font-size: 12px; }
  .rb-inquiries { grid-template-columns: 1fr; gap: 19px; padding-block: 45px; }
  .rb-inquiries .rb-textlink { font-size: clamp(27px, 7vw, 46px); }
  .rb-foot { align-items: flex-start; flex-direction: column; gap: 10px; padding-block: 21px 24px; }
  .rb-foot .rb-nav { column-gap: 24px; }
  .rb-detail-top, .rb-detail-body { grid-template-columns: 1fr; }
  .rb-detail-top { padding-block: 28px; gap: 24px; }
  .rb-detail-top h1 { margin: 12px 0 18px; font-size: clamp(34px, 9vw, 57px); }
  .rb-detail-lead { font-size: 21px; }
  .rb-detail-body { gap: 25px; padding-block: 30px 40px; }
}
@media (max-width: 370px) {
  .rb-head { flex-direction: column; align-items: start; gap: 0; padding-top: 5px; }
  .rb-head .rb-nav { width: 100%; justify-content: space-between; }
  .rb-head .rb-nav a { font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) {
  .corporate-site *, .corporate-site *::before, .corporate-site *::after { animation-duration: 0s !important; transition-duration: 0s !important; scroll-behavior: auto !important; }
}
.rb-contact { display: grid; grid-template-columns: minmax(0, .75fr) minmax(0, 1.25fr); align-items: start; gap: clamp(24px, 4vw, 64px); padding-block: clamp(64px, 8vw, 120px); border-top: 1px solid #0D0D0D; }
.rb-contact :is(h1, h2) { font: 400 clamp(58px, 6.5vw, 99px)/.97 var(--rb-serif); letter-spacing: -.055em; margin: 0; }
.rb-contact-intro { padding-top: 30px; }
.rb-contact-intro p { max-width: 25ch; margin-top: 22px; font-size: clamp(18px, 1.6vw, 25px); line-height: 1.38; letter-spacing: -.035em; }
.rb-contact-intro p:first-child { margin-top: 0; }
.rb-contact form { width: 100%; max-width: 39rem; }
.rb-contact label { display: block; font-size: 15px; font-weight: 560; margin-bottom: 8px; }
.rb-contact :is(input:not([type=hidden]), textarea) { width: 100%; height: 48px; font: inherit; color: var(--rb-ink); background: white; border: 1px solid #898989; border-radius: 0; padding: 11px 13px; line-height: 1.5; }
.rb-contact :is(input, textarea):focus-visible { outline: 2px solid #171717; outline-offset: 2px; }
.rb-contact textarea { display: block; resize: none; min-height: 48px; overflow-y: auto; margin-bottom: 20px; }
.rb-contact small { display: block; margin: 6px 0 20px; color: var(--rb-muted); font-size: 13px; }
.rb-contact button { border: 1px solid var(--rb-ink); background: var(--rb-ink); color: #fff; font-size: 15px; font-weight: 500; padding: 11px 20px; min-height: 48px; cursor: pointer; margin-top: 24px; }
.rb-contact button .rb-arrow { margin-left: .6em; font-size: 1em; }
.rb-contact button:hover { color: var(--rb-ink); background: #fff; }
.rb-contact [role=status]:not(:empty) { margin-top: 14px; }
@media (max-width: 650px) {
  .rb-contact { grid-template-columns: minmax(0, 1fr); gap: 24px; padding-block: 39px 57px; }
  .rb-contact-intro { padding-top: 0; }
  .rb-contact-intro p { margin-top: 15px; }
}

@media (prefers-reduced-motion: no-preference) {
  .rb-inquiries.arrived::before { animation: inquiry-rule 640ms ease-out both; }
  .rb-inquiries.arrived .rb-textlink { animation: inquiry-link 560ms ease-out both; }
  @keyframes inquiry-rule { from { transform: scaleX(.07); } to { transform: scaleX(1); } }
  @keyframes inquiry-link { from { opacity: .42; transform: translateY(.28em); } to { opacity: 1; transform: none; } }
}
